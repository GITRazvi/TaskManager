# File responsibility: Defines production-profile settings for secure deployed backend runtime behavior.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: "*"
      max-age: 3600
      allow-credentials: true

logging:
  level:
    root: WARN
    com.taskmanager: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/taskmanager/taskmanager.log
    max-size: 100MB
    max-history: 90

server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      simple:
        enabled: true

# Production JWT Secret (MUST BE SET via environment variable)
jwt:
  secret: ${JWT_SECRET}
  expiration: 900000
  refresh-expiration: 604800000

